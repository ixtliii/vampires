<style>
/* Layout: full-window 3D canvas (the projected wall); React draws HUD and screens on top */
:root{
  --night:#16132B; --panel:#241F4A; --panel-2:#2E2860;
  --lavender:#C9B8F5; --garlic:#F5D66B; --cream:#F6F1E7; --soft:#DCD3F5; --coral:#F07A6A; --mint:#9FE0C9; --teal:#7FD6E0;

  --body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--cream);font-family:var(--body);overflow:hidden}
#root{position:fixed;inset:0}
canvas.stage{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.layer{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;left:0;top:0;font:700 26px/1 var(--display);white-space:nowrap;
  text-shadow:0 2px 0 rgba(14,11,32,.9),0 0 12px rgba(14,11,32,.8);will-change:transform}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 13px/1 var(--display);
  text-shadow:0 1px 0 rgba(14,11,32,.9);white-space:nowrap;will-change:transform}
.tag .hearts{display:flex;gap:1px;font:700 15px/1 'Segoe UI Symbol','Apple Color Emoji',system-ui,sans-serif;color:var(--coral)}
.tag .hearts i{font-style:normal}
.tag .hearts i.lost{color:rgba(220,211,245,.25)}
.tag .echo{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 4px;border-radius:999px;background:rgba(14,11,32,.75);color:var(--soft);font:600 12px/1 var(--display)}
.tag .echo em{font-style:normal;font-variant-numeric:tabular-nums}
.tag .echo i{width:13px;height:13px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p,0)*1turn), rgba(220,211,245,.2) 0)}
.tag .echo.ready{background:var(--teal);color:#0E0B20;box-shadow:0 0 12px var(--teal);animation:echoPulse 1.1s ease-in-out infinite}
.tag .echo.ready i{background:#0E0B20}
.tag.out{opacity:.6}
.tag.out .nm{color:var(--soft)!important}
@keyframes echoPulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){.tag .echo.ready{animation:none}}
.tag .grab{width:34px;height:34px;border-radius:50%;margin-top:2px;
  background:conic-gradient(var(--mint) calc(var(--p)*1turn), rgba(14,11,32,.55) 0);
  -webkit-mask:radial-gradient(circle, transparent 11px, #000 12px);mask:radial-gradient(circle, transparent 11px, #000 12px)}
.tag.sleep{opacity:.8}

.hud{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:1fr minmax(220px,560px) 1fr;align-items:center;gap:16px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(14,11,32,.88),rgba(14,11,32,.55));pointer-events:none;font-family:var(--display)}
.hud .left{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:600}
.hud .right{justify-self:end;font-size:26px;font-weight:600;color:var(--garlic);font-variant-numeric:tabular-nums}
.sky{position:relative;height:22px;border-radius:11px;background:rgba(255,255,255,.08);overflow:hidden}
.sky i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2C3A8C,#7B4BA0 60%,#F4925A);border-radius:11px}
.sky span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--cream)}
.skyrow{display:flex;align-items:center;gap:10px}
.moon,.sun{width:20px;height:20px;border-radius:50%;flex:none}
.moon{background:var(--soft);box-shadow:inset -6px -4px 0 0 #0E0B20}
.sun{background:#F4B183;box-shadow:0 0 12px #F4B183}
.players{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;max-width:70vw}
.chip{display:flex;align-items:center;gap:6px;background:rgba(14,11,32,.75);border-radius:999px;padding:6px 12px 6px 8px;font:600 14px var(--display)}
.chip b{width:12px;height:12px;border-radius:50%}
.chip.sleep{opacity:.55}
.chip .hp{color:var(--coral);letter-spacing:1px}
.chip .hp s{text-decoration:none;color:rgba(220,211,245,.25)}
.chip .ec{font-size:12px;padding:2px 7px;border-radius:999px;background:rgba(220,211,245,.15);color:var(--soft);font-variant-numeric:tabular-nums}
.chip .ec.ready{background:var(--teal);color:#0E0B20}
.chip.out{opacity:.5}
.badge{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);background:rgba(14,11,32,.7);padding:6px 10px;border-radius:8px;pointer-events:none}
.banner{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:rgba(14,11,32,.86);border-radius:999px;padding:14px 30px;font:700 clamp(20px,2.6vw,34px)/1.1 var(--display);pointer-events:none;text-align:center;max-width:calc(100vw - 32px)}
.count{position:fixed;inset:0;display:grid;place-items:center;font:700 clamp(120px,20vw,240px)/1 var(--display);color:var(--garlic);text-shadow:0 8px 0 rgba(14,11,32,.8);pointer-events:none}
.hint{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);font:600 clamp(15px,1.6vw,21px) var(--display);color:var(--soft);background:rgba(14,11,32,.75);padding:10px 18px;border-radius:14px;pointer-events:none;text-align:center;max-width:calc(100vw - 32px)}

.overlay{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;background:rgba(14,11,32,.8);backdrop-filter:blur(3px);
  padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{margin:auto;width:100%;max-width:900px;background:var(--panel);border-radius:28px;padding:clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:20px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.eyebrow{margin:0;font:700 13px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--lavender)}
h1,h2{margin:0;font-family:var(--display);font-weight:700;line-height:1.02;text-wrap:balance}
h1{font-size:clamp(40px,7vw,76px)} h1 span{color:var(--garlic)}
h2{font-size:clamp(28px,4.4vw,46px);color:var(--garlic)}
.lede{margin:0;font-size:clamp(16px,2vw,19px);line-height:1.5;color:var(--soft);max-width:62ch}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.step{background:var(--panel-2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.step b{font-family:var(--display);font-size:21px;color:var(--lavender)}
.step span{font-size:15px;line-height:1.45;color:var(--soft)}
.step.warn b{color:var(--coral)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:480px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid rgba(201,184,245,.18)}
th{font:700 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--lavender)}
td:first-child{font-weight:700;color:var(--cream)} td{color:var(--soft)}
kbd{font-family:var(--body);font-size:13px;background:var(--night);border:1px solid rgba(201,184,245,.3);border-radius:6px;padding:1px 6px;color:var(--cream)}
.note{margin:0;font-size:14px;line-height:1.5;color:var(--soft)}
.options{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center}
.opt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;color:var(--soft)}
.seg{display:inline-flex;background:var(--night);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--soft);font:600 15px var(--display);padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lavender);color:var(--night)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.big{border:0;background:var(--garlic);color:var(--night);font:700 22px var(--display);padding:14px 28px;border-radius:999px;cursor:pointer;box-shadow:0 6px 0 #B8962A}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #B8962A}
.big:disabled{opacity:.5;cursor:wait}
.ghost{border:2px solid rgba(201,184,245,.4);background:transparent;color:var(--cream);font:600 17px var(--display);padding:11px 22px;border-radius:999px;cursor:pointer}
button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.small{margin:0;font-size:14px;color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel-2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px}
.stat b{font:700 40px/1 var(--display);color:var(--cream);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--soft)}
.quote{margin:0;font:600 clamp(20px,2.6vw,26px)/1.3 var(--display);color:var(--cream)}
@media (prefers-reduced-motion: reduce){.big:active{transform:none}}
</style>

<script type="module">
import * as THREE from 'three';
// ----- src/config.js -----
// =====================================================================
// Vampire Garlic Heist: tuning values and the village layout.
// World units: x runs west (-16) to east (+16), z runs north (-8.5) to south (+8.5).
// The castle fills the east side (x > CASTLE_X). Bats fly at FLY_Y.
// =====================================================================

// ---- gameplay tuning ----
const CASTLE_X = 10.5;
const FURNACE = { x: 13.3, z: 0, r: 1.45 };
const FLY_Y = 2.2;
const GRAB_TIME = 2;          // seconds hovering over garlic to grab it
const GRAB_R = 0.95;          // how close a bat must hover
const MAXV = 8.5;             // bat speed
const CARRY_V = 6.0;          // bat speed while carrying garlic
const ECHO_CD = 6, ECHO_R = 4.2, ECHO_DUR = 2.6;
const IDLE_SLEEP = 25;        // seconds without input before a bat goes back to sleep
const LIGHT_R0 = 2.1, LIGHT_R1 = 2.7; // watchman lantern radius at night / at dawn
const NOTICE = 1.7;           // watchman notices a garlic carrier within LIGHT_R * NOTICE
const LAMP_R = 1.6;           // street lamp light radius
const LAMP_SLOW = 0.45;       // bats in lamp light fly at this share of their speed
const THIRD_WATCHMAN_AT = 0.4; // share of the night after which the night shift starts

// ---- colours ----
const ROOF_COLORS = ['#C9B8F5', '#9FE0C9', '#F4B183', '#F5A8D8', '#7FD6E0', '#F5D66B', '#F7A193'];
const BAT_COLORS = ['#C9B8F5', '#9FE0C9', '#F07A6A', '#F5D66B', '#F4B183', '#7FD6E0', '#F5A8D8'];
const BAT_NAMES = ['Mouse', 'Keys 1', 'Keys 2', 'Pad 1', 'Pad 2', 'Pad 3', 'Pad 4'];

// ---- streets: straight segments [x1, z1, x2, z2] plus the round plaza ----
const STREET_W = 1.3;
const PLAZA = { x: -2, z: 0, r: 2.6 };
const STREETS = [
  [-15, -4.8, 8, -4.8],    // north lane
  [-15, 4.8, 8, 4.8],      // south lane
  [-15, -4.8, -15, 4.8],   // west lane
  [-10, -4.8, -10, 4.8],   // church lane
  [5, -4.8, 5, 4.8],       // east lane
  [-15, 0, -4.6, 0],       // west road into the plaza
  [0.6, 0, 10.5, 0],       // main road from the plaza to the castle gate
  [-2, -8.5, -2, -2.6],    // north road
  [-2, 2.6, -2, 8.5],      // south road
  [-0.2, -1.8, 3.2, -4.8], // north-east alley
  [-3.8, 1.8, -7.2, 4.8]   // south-west alley
];

// ---- houses: centre, size, door direction (f), optional tall / church ----
const HOUSES = [
  // north row, doors face the north lane
  { x: -13.2, z: -7.0, w: 3.0, d: 1.9, f: [0, 1] },
  { x: -9.3, z: -7.0, w: 2.6, d: 1.9, f: [0, 1], tall: true },
  { x: -5.4, z: -7.1, w: 3.2, d: 1.8, f: [0, 1] },
  { x: 5.2, z: -7.0, w: 3.0, d: 1.9, f: [0, 1], tall: true },
  // south row, doors face the south lane
  { x: -13.2, z: 7.0, w: 3.0, d: 1.9, f: [0, -1], tall: true },
  { x: -9.0, z: 7.1, w: 2.4, d: 1.8, f: [0, -1] },
  { x: -5.4, z: 7.0, w: 3.0, d: 1.9, f: [0, -1] },
  { x: 1.6, z: 7.0, w: 3.0, d: 1.9, f: [0, -1], tall: true },
  { x: 6.0, z: 7.1, w: 2.8, d: 1.8, f: [0, -1] },
  // middle of the village, doors face the east-west roads
  { x: -12.8, z: -2.4, w: 2.8, d: 1.8, f: [0, 1] },
  { x: -12.8, z: 2.4, w: 2.8, d: 1.8, f: [0, -1], tall: true },
  { x: -7.0, z: -2.5, w: 3.2, d: 2.1, f: [0, 1], church: true },
  { x: -8.0, z: 2.3, w: 2.4, d: 1.8, f: [0, -1] },
  { x: 3.2, z: -1.9, w: 2.2, d: 1.7, f: [0, 1] },
  { x: 2.7, z: 2.2, w: 2.6, d: 1.7, f: [0, -1], tall: true },
  { x: 8.0, z: -2.4, w: 3.0, d: 1.8, f: [0, 1] },
  { x: 8.0, z: 2.4, w: 3.0, d: 1.8, f: [0, -1] }
];

// ---- watchmen patrol routes (on the streets) ----
const PATHS = [
  [[-15, -4.8], [5, -4.8], [5, 4.8], [-15, 4.8]],               // the long outer round
  [[-10, -4.8], [-2, -4.8], [-2, -2.6], [-4.6, 0], [-10, 0]],    // church and plaza (west)
  [[5, 4.8], [-2, 4.8], [-2, 2.6], [0.6, 0], [5, 0]]             // night shift: plaza and main road (east)
];

// ---- street lamps on timers: on for `on` seconds, then off for `off` seconds ----
const LAMPS = [
  { x: -10, z: 0, on: 6, off: 4, offset: 0 },
  { x: 5, z: 0, on: 6, off: 4, offset: 5 },
  { x: -2, z: -4.8, on: 5, off: 5, offset: 2.5 },
  { x: -2, z: 4.8, on: 5, off: 5, offset: 7.5 }
];

// ---- decoration ----
const TREES = [[-15.3, -6.8], [-15.3, 6.8], [-11.0, 7.9], [3.85, 8.0],
  [9.2, -7.5], [9.2, 7.5], [-4.4, -3.4], [-0.4, -3.5], [-3.2, 3.6]];
const GRAVEYARD = { x: 1.6, z: -7.0, w: 3.2, d: 2.2 };
const STALLS = [{ x: -1.2, z: -1.65, color: '#F07A6A' }, { x: -2.8, z: 1.65, color: '#7FD6E0' }];

// ----- src/audio.js -----
// =====================================================================
// Web Audio synth: the looping theme (speeds up towards sunrise) and all sound effects.
// No audio files needed.
// =====================================================================
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
// "gar-lic gar-lic yuck yuck yuck": two 16-step phrases in A minor
const MEL = [[69, null, 72, 69, 76, null, 74, 72, 71, null, 68, 71, 64, null, null, null],
             [69, null, 72, 69, 76, null, 77, 76, 74, 72, 71, 68, 69, null, null, null]];
const BASS = [[45, 45, 40, 40, 45, 45, 40, 40], [45, 45, 41, 41, 40, 40, 45, 45]];

class Sound {
  constructor() { this.ac = null; this.on = true; this.music = false; this.step = 0; this.next = 0; this.tempo = 0; }
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      this.ac = ac;
      this.master = ac.createGain(); this.master.gain.value = this.on ? 0.8 : 0; this.master.connect(ac.destination);
      this.mg = ac.createGain(); this.mg.gain.value = 0.3; this.mg.connect(this.master);
      this.sg = ac.createGain(); this.sg.gain.value = 0.75; this.sg.connect(this.master);
      this.nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = this.nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      setInterval(() => this.schedule(), 25);
    } catch (e) { this.ac = null; }
  }
  setOn(v) { this.on = v; if (this.master) this.master.gain.setTargetAtTime(v ? 0.8 : 0, this.ac.currentTime, 0.05); }
  now() { return this.ac ? this.ac.currentTime : 0; }
  tone(f, dur, type, vol, t0, slide, dest) {
    const ac = this.ac; if (!ac) return;
    const t = t0 ?? ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sg); o.start(t); o.stop(t + dur + 0.05);
  }
  noise(dur, f0, f1, vol, q = 1, t0, dest) {
    const ac = this.ac; if (!ac) return;
    const t = t0 ?? ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = this.nb; f.type = 'bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sg); s.start(t); s.stop(t + dur + 0.05);
  }
  play(name) {
    if (!this.ac) return; const t = this.now();
    switch (name) {
      case 'yuck': this.tone(560, .16, 'square', .17, t, 220); this.tone(320, .24, 'square', .14, t + .12, 110); break;
      case 'whoosh': this.noise(.6, 300, 3200, .5, 1.2); this.tone(110, .5, 'sine', .3, t, 45); break;
      case 'squeak': this.tone(2200, .07, 'sine', .2, t, 3300); this.tone(2500, .07, 'sine', .16, t + .09, 3700); break;
      case 'alarm': this.tone(880, .14, 'square', .16, t); this.tone(660, .22, 'square', .16, t + .15); break;
      case 'hey': this.tone(330, .12, 'square', .12, t, 420); break;
      case 'meow': this.tone(720, .18, 'sawtooth', .1, t, 900); this.tone(900, .3, 'sawtooth', .1, t + .17, 520); break;
      case 'lamp': this.tone(1200, .05, 'square', .05, t); this.tone(900, .05, 'square', .05, t + .07); break;
      case 'puff': this.noise(.55, 900, 160, .45, .7); break;
      case 'yawn': this.tone(430, .55, 'triangle', .2, t, 230); break;
      case 'ready': this.tone(1320, .08, 'sine', .12, t); this.tone(1760, .12, 'sine', .1, t + .08); break;
      case 'tick': this.tone(880, .12, 'sine', .25); break;
      case 'more': [0, .08, .16].forEach((d, i) => this.tone(660 + i * 220, .12, 'triangle', .15, t + d)); break;
      case 'win': [69, 72, 76, 81].forEach((m, i) => this.tone(mf(m), .5, 'triangle', .2, t + i * .12)); break;
      case 'mwahaha':
        this.tone(150, .5, 'sawtooth', .2, t, 120);
        [.55, .85, 1.15, 1.45].forEach((d, i) => this.tone(240 - i * 22, .24, 'sawtooth', .2, t + d, 170 - i * 18));
        this.tone(70, 1.9, 'sine', .28, t, 45); break;
      case 'rooster': {
        const ac = this.ac, o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
        o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 2400;

  // =================================================================
  // camera
  // =================================================================
  resize() {
    const w = window.innerWidth, h = window.innerHeight;
    this.renderer.setSize(w, h);
    const cam = this.camera; cam.aspect = w / h;
    const vf = cam.fov * Math.PI / 180, hf = 2 * Math.atan(Math.tan(vf / 2) * cam.aspect), tilt = 58 * Math.PI / 180;
    const dist = Math.max(17.2 / Math.tan(hf / 2), 10.2 * Math.sin(tilt) / Math.tan(vf / 2)) * 1.02;
    cam.position.set(this.camTarget.x, Math.sin(tilt) * dist, this.camTarget.z + Math.cos(tilt) * dist);
    cam.lookAt(this.camTarget); cam.updateProjectionMatrix();
    this.vw = w; this.vh = h;
  }
  toScreen(x, y, z) {
    const v = this.tmpV.set(x, y, z).project(this.camera);
    return [(v.x + 1) / 2 * this.vw, (1 - v.y) / 2 * this.vh];
  }

  // =================================================================
  // input: mouse, two keyboard players, up to 4 gamepads / Joy-Cons
  // =================================================================
  bindInput() {
    const c = this.canvas;
    const setMouse = e => {
      this.mouse.ndc.set(e.clientX / this.vw * 2 - 1, -(e.clientY / this.vh) * 2 + 1);
      this.ray.setFromCamera(this.mouse.ndc, this.camera);
      const hit = this.ray.ray.intersectPlane(this.flyPlane, this.tmpV);
      if (hit) { this.mouse.x = hit.x; this.mouse.z = hit.z; }
      this.mouse.last = this.time;
    };
    c.addEventListener('pointermove', setMouse);
    c.addEventListener('pointerdown', e => {
      setMouse(e);
      if (this.state !== 'play') return;
      if (e.button === 2) { this.tryEcho(this.bats[0]); return; }
      if (this.bats[0].state === 'sleep') this.wake(this.bats[0]);
    });
    c.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => {
      const k = e.key, kl = k.length === 1 ? k.toLowerCase() : k;
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
      if (k === 'Escape' && this.state !== 'menu') { this.toMenu(); return; }
      const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
      if (this.state === 'menu' && k === 'Enter' && !onButton) { this.start(); return; }
      if (this.state === 'end' && (k === 'Enter' || k === ' ') && this.endTimer > 1.2 && !onButton) { this.start(); return; }
      this.keys.add(kl);
      if (this.state !== 'play' || e.repeat) return;
      if ('wasd'.includes(kl) && kl.length === 1 && this.bats[1].state === 'sleep') this.wake(this.bats[1]);
      if (k.startsWith('Arrow') && this.bats[2].state === 'sleep') this.wake(this.bats[2]);
      if (k === ' ') this.tryEcho(this.bats[0]);
      if (kl === 'e') this.tryEcho(this.bats[1]);
      if (k === 'Enter') this.tryEcho(this.bats[2]);
    });
    window.addEventListener('keyup', e => this.keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
    window.addEventListener('blur', () => this.keys.clear());

  readPads() {
    let pads = [];
    try { pads = navigator.getGamepads ? Array.from(navigator.getGamepads()) : []; } catch (e) { pads = []; }
    const out = [];
    for (let i = 0; i < 4; i++) {
      const gp = pads[i];
      if (!gp) { out.push(null); this.prevPad[i] = []; continue; }
      const pressed = gp.buttons.map(b => b.pressed), prev = this.prevPad[i] || [];
      const edges = pressed.map((p, j) => p && !prev[j]); this.prevPad[i] = pressed;
      let ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      if (Math.hypot(ax, ay) < .2 && gp.axes.length > 3) { ax = gp.axes[2] || 0; ay = gp.axes[3] || 0; }
      if (pressed[12]) ay = -1; if (pressed[13]) ay = 1; if (pressed[14]) ax = -1; if (pressed[15]) ax = 1;
      const m = Math.hypot(ax, ay); if (m < .2) { ax = 0; ay = 0; } else if (m > 1) { ax /= m; ay /= m; }
      out.push({ ax, ay, edges, any: edges.some(Boolean) });
    }
    return out;
  }

  rumble(b, dur, weak, strong) {
    if (b.slot < 3) return;
    try {
      const gp = navigator.getGamepads ? navigator.getGamepads()[b.slot - 3] : null, a = gp && gp.vibrationActuator;
      if (a && a.playEffect) a.playEffect('dual-rumble', { duration: dur * 1000, weakMagnitude: weak, strongMagnitude: strong }).catch(() => {});
    } catch (e) { /* rumble not available */ }
  }

    this.resetRound(); this.state = 'play';

    this.cb.onScreen('menu');
  }

    Object.assign(this, { outEnd: false, burned: 0, goldenFound: 0, caught: 0, dusted: 0, maxActive: 0, elapsed: 0, started: false, roosterDone: false, shiftDone: false, cdT: 0, bossT: 0, endTimer: 0 });

    this.flyers.forEach(f => { f.active = false; f.g.visible = f.gold.visible = false; });

    normal.forEach(s => { s.count = 0; s.revealT = 0; });
    shuffle(normal.slice()).slice(0, START_GARLIC).forEach(s => { s.count = 1; });

  // =================================================================
  // gameplay actions
  // =================================================================

  // =================================================================

      if (!this.shiftDone) { this.shiftDone = true; this.showBanner('The night shift starts: another watchman!', 3, '#F07A6A'); this.sound.play('alarm'); }
    }

    this.updateWatchmen(dt, p, !this.started);
    this.updateCat(dt, !this.started);
    this.flyers.forEach(f => {

      if (wasCooling && b.echoCd <= 0 && this.state === 'play') { this.addFloat(b.x, FLY_Y + 1.1, b.z, 'echo ready!', '#7FD6E0', 18, 1); this.sound.play('ready'); this.rumble(b, .08, .3, 0); } b.stunT = Math.max(0, b.stunT - dt); b.invulnT = Math.max(0, b.invulnT - dt);

      if (lamp && !b.inLamp) { this.addFloat(b.x, FLY_Y + 1, b.z, 'slooow…', '#FFE9A8', 20, 1); this.rumble(b, .2, .5, 0); }
      b.inLamp = lamp;

          }

        this.addFloat(FURNACE.x, 3, FURNACE.z, g ? '+3 golden!' : 'whoosh! +1', g ? '#FFD84A' : '#F5D66B', 30);
        this.burst(FURNACE.x, 1, FURNACE.z, 30, ['#F5D66B', '#F4B183', '#F07A6A', '#FFF3B0'], 5, 1, 1.4, 4);

    });

    if (this.state === 'play' && this.started) {
      this.elapsed += dt;
      const pp = this.elapsed / this.roundTime;
      if (pp >= .86 && !this.roosterDone) { this.roosterDone = true; this.sound.play('rooster'); this.showBanner('Cock-a-doodle-doo! Back to the castle!', 4, '#F4B183'); }
      if (this.remaining() === 0) { this.state = 'countdown'; this.cdT = 3; this.lastCd = 4; this.showBanner('All the garlic is gone! Hold on…', 3, '#F5D66B'); }
      else if (pp >= 1) this.sunUp();
      else if (this.activeBats().length === 0 && this.bats.some(b => b.state === 'out')) { // the last bat in the air got caught

      }
    } else if (this.state === 'countdown') {

  }

  }

      if (idle && this.state !== 'menu' && this.state !== 'end') return;
      if (w.pause > 0) { w.pause -= dt; w.angle += Math.sin(this.time * 2.5) * dt * 1.5; return; }
      if (w.mode === 'chase') {

        if (!b || b.state !== 'active' || !b.carrying || b.invulnT > 0 || w.chaseT <= 0) { w.mode = 'return'; w.chaseBat = null; w.pause = .6; return; }
      }

      else if (w.mode === 'investigate') { tx = w.inv.x; tz = w.inv.z; sp = 3.0; }

    });

  }

  // =================================================================
  // per-frame visuals
  // =================================================================
  updateVisuals() {
    const t = this.time, p = this.started ? clamp(this.elapsed / this.roundTime, 0, 1) : 0;
    const R = this.lightR || LIGHT_R0;
    this.scene.background.set('#0B0920').lerp(new THREE.Color('#E8956A'), p * p);
    this.hemi.color.set('#4a4aa0').lerp(new THREE.Color('#FFD2A8'), p);
    this.hemi.groundColor.set('#1a1030').lerp(new THREE.Color('#6A4A50'), p);
    this.hemi.intensity = lerp(1.1, 2.0, p);
    this.sun.color.set('#a8b4ff').lerp(new THREE.Color('#FFB070'), p);
    this.sun.intensity = lerp(1.2, 3.2, p * p);
    this.sun.position.set(lerp(-8, 22, p), lerp(20, 9, p), lerp(6, 4, p));

    const fl = 1 + Math.sin(t * 9) * .06 + Math.sin(t * 23) * .04;
    this.furnaceLight.intensity = 40 * fl; this.furnaceGlow.scale.setScalar(8 * fl);
    this.flames.forEach((f, i) => {
      const a = f.a + t * .9, r = .55 + Math.sin(t * 5 + f.ph) * .25, life = (t * 1.4 + f.ph) % 1;
      f.m.position.set(FURNACE.x + Math.cos(a) * r, .8 + life * 1.3, FURNACE.z + Math.sin(a) * r);
      f.m.scale.setScalar((.38 + Math.sin(t * 11 + i) * .08) * (1 - life * .7));
    });

    // street lamps
    this.lamps.forEach(L => {
      const blink = L.warn && Math.floor(t * 8) % 2 === 0;
      const on = L.onNow;
      L.pool.visible = on || blink; L.ring.visible = on || L.warn;
      L.pool.material.opacity = on ? .7 : .25; L.ring.material.opacity = on ? .6 : .3;
      L.headMat.color.set(on ? '#FFE9A8' : blink ? '#B8A46A' : '#4A4370');
      L.light.intensity = on ? 10 : blink ? 3 : 0;
    });

    this.spots.forEach(s => {
      const vis = !s.golden || s.revealT > 0, n = Math.min(s.count, s.bulbs.length);
      s.bulbs.forEach((m, i) => { m.visible = vis && i < n; });

    });

      const gold = f.spot && f.spot.golden, g = gold ? f.gold : f.g, other = gold ? f.g : f.gold;
      other.visible = false; g.visible = f.active;
      if (!f.active) return;
      g.position.set(lerp(f.x0, f.spot.x, f.t), lerp(FLY_Y - .6, 0, f.t) + Math.sin(f.t * Math.PI) * 2, lerp(f.z0, f.spot.z, f.t));

    });

    this.watchmen.forEach(w => {
      const vis = w.active; w.g.visible = w.pool.visible = w.ring.visible = w.light.visible = vis;
      if (!vis) return;
      w.g.position.set(w.x, w.pause <= 0 ? Math.abs(Math.sin(t * 8)) * .06 : 0, w.z); w.g.rotation.y = w.angle;
      const fl2 = 1 + Math.sin(t * 13 + w.x) * .03;
      w.pool.position.set(w.x, .1, w.z); w.pool.scale.setScalar(R * 2.25 * fl2);
      w.ring.position.set(w.x, .11, w.z); w.ring.scale.setScalar(R);
      const hot = w.alertT > 0 || w.mode === 'chase';
      w.ring.material.color.set(hot ? '#FF5A4A' : w.mode === 'investigate' ? '#F4B183' : '#FFE08A');
      w.pool.material.color.set(hot ? '#FF9A7A' : '#FFD98A');
      w.light.intensity = 14 * fl2;
    });
    const c = this.cat; c.g.position.set(c.x, c.pause > 0 ? 0 : Math.abs(Math.sin(t * 10)) * .04, c.z); c.g.rotation.y = c.angle || 0; c.tail.rotation.z = Math.sin(t * 3) * .5;

      b.g.visible = show; b.ring.visible = show && b.state === 'active';
      if (!show) { b.tag.hidden = true; b.beacon.visible = false; b.waves.forEach(w => { w.visible = false; }); return; }

      if (sleeping) {

        b.g.rotation.set(0, b.yaw, 0);
        const flap = Math.sin(t * (b.carrying ? 20 : 15) + b.slot) * .75;
        b.wingR.rotation.z = flap; b.wingL.rotation.z = -flap; if (b.eyes) b.eyes.visible = true;
        b.ring.position.set(b.x, .12, b.z); b.ring.material.opacity = b.stunT > 0 ? .3 : .85;
        b.g.visible = !(b.stunT > 0 && Math.floor(t * 12) % 2);

      // echolocation beacon over the closest garlic + sonar ripple at the bat
      if (b.echo && b.echo.spot) {
        const s = b.echo.spot, et = b.echo.t, fade = et > ECHO_DUR - .5 ? (ECHO_DUR - et) / .5 : Math.min(1, et / .2);
        const arrived = clamp((et - .25) / .3, 0, 1); // the marker pops in when the first wave arrives
        b.beacon.visible = arrived > 0; b.beacon.position.set(s.x, 0, s.z);
        b.arrow.position.y = 2.0 + Math.abs(Math.sin(t * 6)) * .45; b.arrow.rotation.y = t * 3; b.arrow.scale.setScalar(arrived);
        b.arrow.material.opacity = fade;
        const pr = 1 + (t * 1.5 % 1) * .8; b.bRing.scale.setScalar(pr); b.bRing.material.opacity = .9 * fade * (1.8 - pr);
        b.bGlow.material.opacity = (.55 + Math.sin(t * 8) * .2) * fade;
        // sound-wave arcs flowing from the bat to the garlic
        const tgt = this.tmpV.set(s.x, .6, s.z);
        b.waves.forEach((w, i) => {
          const u = (et * 1.4 - i / b.waves.length + 1) % 1;
          w.visible = true;
          w.position.set(lerp(b.x, s.x, u), lerp(FLY_Y, .6, u), lerp(b.z, s.z, u));
          w.lookAt(tgt); w.scale.setScalar(.7 + u * 1.3);

      } else { b.beacon.visible = false; b.waves.forEach(w => { w.visible = false; }); }
      b.tag.hidden = false;
      const [sx, sy] = this.toScreen(b.g.position.x, b.g.position.y + (sleeping ? .7 + (b.slot % 2) * .55 : .8), b.g.position.z);
      b.tag.style.transform = `translate(${sx}px, ${sy}px) translate(-50%, -100%)`;
      const cache = b.tagCache, out = b.state === 'out';

      if (cache.lives !== b.lives) { cache.lives = b.lives; b.tagHearts.forEach((hEl, i) => hEl.classList.toggle('lost', i >= b.lives)); }
      const ready = b.echoCd <= 0 && b.wakeT <= 0, echoTxt = sleeping ? '' : ready ? 'Echo ready' : `Echo ${Math.ceil(b.echoCd)}s`;
      if (cache.echo !== echoTxt) { cache.echo = echoTxt; b.tagEcho.hidden = sleeping; b.tagEchoTxt.textContent = echoTxt; b.tagEcho.classList.toggle('ready', ready); }
      if (!ready && !sleeping) b.tagEcho.style.setProperty('--p', (1 - b.echoCd / ECHO_CD).toFixed(3));

    // the big vampire: waits in the courtyard, walks into the village on a total win
    const HOME = [14.3, -4.2];
    if (this.state === 'boss') {
      const k = Math.min(1, this.bossT / 2.6);

      this.boss.scale.setScalar(lerp(1, 1.25, k));

      this.boss.position.set(HOME[0], Math.abs(Math.sin(t * 1.5)) * .05, HOME[1]);
      this.boss.rotation.y = -Math.PI / 2 + Math.sin(t * .6) * .35; this.boss.scale.setScalar(1);
    }

    for (let i = 0; i < 400; i++) {
      const pt = this.parts[i];
      if (!pt) { this.tmpM.makeScale(0, 0, 0); this.partMesh.setMatrixAt(i, this.tmpM); continue; }
      const sc = pt.size * Math.max(0, pt.life / pt.max);
      this.tmpM.compose(this.tmpV.set(pt.x, pt.y, pt.z), this.tmpQ, this.tmpS.set(sc, sc, sc));

      f.life -= this.dt; if (f.life <= 0) { f.el.remove(); return false; }
      const [sx, sy] = this.toScreen(f.x, f.y + (f.max - f.life) * .8, f.z);
      f.el.style.transform = `translate(${sx}px, ${sy}px) translate(-50%, -50%)`;
      f.el.style.opacity = Math.min(1, f.life / .35);

    });
  }
  frame() {
    const now = performance.now(), dt = Math.min(.05, (now - this.last) / 1000); this.last = now; this.dt = dt;

      banner: this.banner ? { text: this.banner.text, color: this.banner.color } : null,

      backend: this.backend
    };
  }
}
